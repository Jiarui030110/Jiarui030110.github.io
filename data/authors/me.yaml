bio: |
  Hi, I'm a second-year Master's student in the Department of Mechanical Engineering, <a class="bio-link-university" href="https://www.zju.edu.cn/" target="_blank" rel="noopener">Zhejiang University</a>, supervised by <a class="bio-link" href="https://scholar.google.com/citations?hl=zh-CN&user=xJm3BLsAAAAJ" target="_blank" rel="noopener">Prof. Peng Zhao</a>. My research interests lie in robotics, including <strong>tactile perception</strong>, <strong>bio-inspired robots</strong>, and <strong>robotic manipulation</strong>. Particularly, I aim to integrate <strong>hardware design</strong> and <strong>machine learning methods</strong> to develop more intelligent and capable robotic systems with better performance.
  
  Previously, I also obtained my bachelor's degree in the Department of Mechanical Engineering, <a class="bio-link-university" href="https://www.zju.edu.cn/" target="_blank" rel="noopener">Zhejiang University</a>, where I was fortunate to work under the supervision of <a class="bio-link" href="https://scholar.google.com/citations?user=vpaskyAAAAAJ&hl=zh-CN&oi=ao" target="_blank" rel="noopener">Prof. Tiefeng Li</a> and <a class="bio-link" href="https://person.zju.edu.cn/skyhover" target="_blank" rel="noopener">Prof. Jin Wang</a>.


  <p class="phd-note">Prospective PhD applicant for Fall 2027. I am also looking for internships and visiting opportunities, please feel free to contact me : )</p>
